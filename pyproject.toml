[project]
name = "comfyui-reference-latent-plus"
description = "A drop-in replacement for ComfyUI's stock ReferenceLatent node with per-image strength, per-image timestep gating, per-image MediaPipe auto-masks, a megapixel cap on attention cost, and 1–4 image inputs in a single node. Works with Flux, Flux2/Klein, Lumina2, Z-Image, Wan, Hunyuan, and Qwen-Image."
version = "1.0.0"
license = "MIT"
authors = [
    { name = "Peter Neill" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/shootthesound/comfyui-ReferenceLatentPlus"
Repository = "https://github.com/shootthesound/comfyui-ReferenceLatentPlus"
Issues = "https://github.com/shootthesound/comfyui-ReferenceLatentPlus/issues"

[tool.comfy]
PublisherId = "shootthesound"
DisplayName = "Reference Latent+"
Icon = ""
